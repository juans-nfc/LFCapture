# Include inside the tools.northernfruit.com server {} block.
# The container listens on 8087 (docker-compose.yml). The trailing slash on proxy_pass strips /lfcapture.

location = /lfcapture { return 301 /lfcapture/; }

location /lfcapture/ {
    proxy_pass         http://127.0.0.1:8087/;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;

    client_max_body_size 100m;     # PDF uploads
    proxy_read_timeout   180s;     # Claude read of a long PDF can take a minute
    proxy_send_timeout   180s;
}
