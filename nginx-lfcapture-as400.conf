# Add INSIDE the tools.northernfruit.com 443 server block, ABOVE the "location /lfcapture/" block
# (next to nginx-lfcapture-workflow.conf). Both bypass oauth2-proxy; the app checks its own tokens.

# AS400 Bridge desktop agent → newest AS400 record per user (AS400_AGENT_TOKEN)
location = /lfcapture/api/as400/current {
    allow 192.168.1.0/24;      # the AP desktops' LAN
    deny  all;
    proxy_pass         http://127.0.0.1:8096/api/as400/current;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
}

# Laserfiche Workflow "Fill from AS400" business process (LF_WORKFLOW_TOKEN)
location = /lfcapture/api/as400/apply {
    allow 192.168.1.0/24;      # tighten to the Laserfiche server's IP if you like
    deny  all;
    proxy_pass         http://127.0.0.1:8096/api/as400/apply;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
}
