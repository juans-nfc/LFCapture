# Add INSIDE the tools.northernfruit.com 443 server block, ABOVE the "location ^~ /lfcapture/" block.
# Laserfiche Workflow has no M365 session, so this one endpoint bypasses oauth2-proxy.
# The app checks its own bearer token (LF_WORKFLOW_TOKEN); we additionally limit it to the LF server's IP.
location = /lfcapture/api/lf/read {
    allow 192.168.1.0/24;      # <- your LAN / the Laserfiche server's address; tighten to a single host if you like
    deny  all;

    proxy_pass         http://127.0.0.1:8096/api/lf/read;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
}
